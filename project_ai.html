<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI Interaction Node - Xu Wang</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB2aWV3Qm94PSIwIDAgMTAwIDEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZGVmcz48ZmlsdGVyIGlkPSJzIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC4wMTUiIG51bU9jdGF2ZXM9IjMiIHJlc3VsdD0ibm9pc2UiLz48ZmVEaXNwbGFjZW1lbnRNYXAgaW49IlNvdXJjZUdyYXBoaWMiIGluMj0ibm9pc2UiIHNjYWxlPSIyIiB4Q2hhbm5lbFNlbGVjdG9yPSJSIiB5Q2hhbm5lbFNlbGVjdG9yPSJHIi8+PC9maWx0ZXI+PC9kZWZzPjxlbGxpcHNlIGN4PSI1MCIgY3k9IjYwIiByeD0iMzUiIHJ5PSIyNSIgZmlsbD0iI2ZmZmZmZiIgZmlsdGVyPSJ1cmwoI3MpIi8+PGVsbGlwc2UgY3g9IjMwIiBjeT0iNTUiIHJ4PSIyMCIgcnk9IjE4IiBmaWxsPSIjZmZmZmZmIiBmaWx0ZXI9InVybCgjcykiLz48ZWxsaXBzZSBjeD0iNzAiIGN5PSI1NSIgcng9IjIyIiByeT0iMjAiIGZpbGw9IiNmZmZmZmYiIGZpbHRlcj0idXJsKCNzKSIvPjxlbGxpcHNlIGN4PSI1MCIgY3k9IjQ1IiByeD0iMjUiIHJ5PSIyMCIgZmlsbD0iI2ZmZmZmZiIgZmlsdGVyPSJ1cmwoI3MpIi8+PC9zdmc+">
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --brand: #6366f1;
      --brand-hover: #4f46e5;
      --danger: #ef4444;
      --success: #10b981;
      --border: #334155;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Terminal UI Theme */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1::before {
      content: "";
      display: block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }
    .header-nav {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 14px;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn:hover {
      background: var(--surface-hover);
    }
    .btn-primary {
      background: var(--brand);
      border-color: var(--brand);
      color: white;
    }
    .btn-primary:hover {
      background: var(--brand-hover);
      border-color: var(--brand-hover);
    }
    .btn-success {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.3);
      color: var(--success);
    }
    .btn-success:hover {
      background: rgba(16, 185, 129, 0.2);
    }

    /* Auth Screen */
    #auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 32px;
    }
    .auth-title {
      text-align: center;
    }
    .auth-title h2 { margin: 0 0 8px; font-family: var(--font-mono); }
    .auth-title p { margin: 0; color: var(--muted); }
    .role-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 640px;
    }
    .role-card {
      background: var(--surface);
      border: 1px solid var(--border);
      color: inherit;
      font: inherit;
      width: 100%;
      border-radius: 12px;
      padding: 32px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .role-card:hover {
      transform: translateY(-4px);
      border-color: var(--brand);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.15);
    }
    .role-card h3 {
      margin: 0 0 12px;
      font-family: var(--font-mono);
      color: var(--brand);
    }
    .role-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    /* Dashboard */
    #dashboard-screen {
      display: none;
      flex-direction: column;
      gap: 24px;
      flex: 1;
    }
    .dashboard-header {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      padding: 16px 24px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .node-status {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--brand);
    }

    /* Panels */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    .panel-title {
      margin: 0 0 20px;
      font-family: var(--font-mono);
      font-size: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    /* Forms */
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--muted);
    }
    .form-control {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 15px;
    }
    .form-control:focus {
      outline: 3px solid rgba(99, 102, 241, 0.45);
      outline-offset: 2px;
      border-color: var(--brand);
    }
    textarea.form-control {
      resize: vertical;
      min-height: 100px;
      font-family: var(--font-mono);
      font-size: 13px;
    }

    /* Task List */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .task-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: grid;
      gap: 12px;
    }
    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .task-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .task-meta {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-family: var(--font-mono);
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-completed { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }

    .task-desc {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
      white-space: pre-wrap;
    }
    .task-report-box {
      margin-top: 12px;
      padding: 12px;
      background: rgba(16, 185, 129, 0.05);
      border-left: 3px solid var(--success);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 13px;
    }
    .task-report-box p {
      margin: 0;
      color: #a7f3d0;
      white-space: pre-wrap;
    }
    .task-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    #publish-panel, #execute-panel {
      display: none;
    }
    :focus-visible {
      outline: 3px solid #818cf8;
      outline-offset: 3px;
    }
    @media (max-width: 680px) {
      .container { padding: 16px; }
      .header { align-items: flex-start; gap: 16px; }
      .header h1 { font-size: 18px; }
      .header-nav { gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
      .role-cards { grid-template-columns: 1fr; gap: 14px; }
      .role-card { padding: 22px 18px; min-height: 44px; }
      .panel { padding: 18px 14px; }
      .task-header { flex-direction: column; }
      .task-actions { flex-wrap: wrap; }
      .btn { min-height: 44px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>[AI_SYNC_NODE]</h1>
      <div class="header-nav">
        <a href="/" class="btn">Return to Home</a>
        <button id="btnLogout" class="btn" style="display:none;" onclick="logout()">Disconnect</button>
      </div>
    </header>

    <main id="auth-screen">
      <div class="auth-title">
        <h2>Establish Connection</h2>
        <p>Select your operational node type to continue</p>
      </div>
      <div class="role-cards">
        <button class="role-card" type="button" onclick="login('publisher')">
          <h3>[NODE: ALPHA]</h3>
          <p>Publisher Node. Responsible for generating tasks, defining parameters, and evaluating execution reports.</p>
        </button>
        <button class="role-card" type="button" onclick="login('executor')">
          <h3>[NODE: BETA]</h3>
          <p>Executor Node. Responsible for processing pending tasks, executing operations, and submitting reports.</p>
        </button>
      </div>
    </main>

    <main id="dashboard-screen">
      <div class="dashboard-header">
        <div class="node-status">
          STATUS: ONLINE | ROLE: <span id="lblRole">UNKNOWN</span>
        </div>
      </div>

      <!-- Publisher Panel -->
      <div id="publish-panel" class="panel">
        <div class="panel-title">Deploy New Task</div>
        <form id="formCreateTask" onsubmit="createTask(event)">
          <div class="form-group">
            <label for="txtTitle">TASK_TITLE</label>
            <input type="text" id="txtTitle" name="title" class="form-control" required placeholder="e.g. Optimize data pipeline" />
          </div>
          <div class="form-group">
            <label for="txtDesc">TASK_PARAMETERS</label>
            <textarea id="txtDesc" name="description" class="form-control" required placeholder="Define specific parameters and goals..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Deploy Task</button>
        </form>
      </div>

      <!-- Shared Task List Panel -->
      <div class="panel">
        <div class="panel-title">
          <span>Task Stream</span>
          <button class="btn" onclick="fetchTasks()" style="padding: 4px 8px;">Refresh</button>
        </div>
        <div id="taskList" class="task-list">
          <!-- Tasks injected here -->
        </div>
      </div>
    </main>
  </div>

  <script>
    let currentRole = null;

    async function init() {
      try {
        const res = await fetch('/api/project/auth/status');
        const data = await res.json();
        if (data.ok && data.role) {
          currentRole = data.role;
          showDashboard();
        } else {
          showAuth();
        }
      } catch (err) {
        showAuth();
      }
    }

    async function login(role) {
      try {
        const res = await fetch('/api/project/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({role: role})
        });
        const data = await res.json();
        if (data.ok) {
          currentRole = role;
          showDashboard();
        } else {
          alert('Login failed: ' + data.error);
        }
      } catch (err) {
        alert('Connection error');
      }
    }

    async function logout() {
      await fetch('/api/project/logout', { method: 'POST' });
      currentRole = null;
      showAuth();
    }

    function showAuth() {
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('dashboard-screen').style.display = 'none';
      document.getElementById('btnLogout').style.display = 'none';
    }

    function showDashboard() {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('dashboard-screen').style.display = 'flex';
      document.getElementById('btnLogout').style.display = 'inline-flex';

      document.getElementById('lblRole').textContent = currentRole.toUpperCase();

      if (currentRole === 'publisher') {
        document.getElementById('publish-panel').style.display = 'block';
      } else {
        document.getElementById('publish-panel').style.display = 'none';
      }

      fetchTasks();
    }

    async function createTask(e) {
      e.preventDefault();
      const title = document.getElementById('txtTitle').value;
      const desc = document.getElementById('txtDesc').value;

      const res = await fetch('/api/project/task/create', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({title, desc})
      });
      const data = await res.json();
      if (data.ok) {
        document.getElementById('formCreateTask').reset();
        fetchTasks();
      } else {
        alert('Failed to deploy task: ' + data.error);
      }
    }

    async function fetchTasks() {
      const res = await fetch('/api/project/tasks');
      const data = await res.json();
      const list = document.getElementById('taskList');
      if (!data.ok || !data.tasks || data.tasks.length === 0) {
        list.innerHTML = '<div class="empty" style="color:var(--muted)">No tasks found in stream.</div>';
        return;
      }

      list.innerHTML = data.tasks.map(t => {
        const date = new Date(t.created_at).toLocaleString();
        const status = t.status === 'completed' ? 'completed' : 'pending';
        let reportHtml = '';
        if (status === 'completed' && t.report) {
          reportHtml = `
            <div class="task-report-box">
              <div style="color:var(--success);margin-bottom:4px;">> EXECUTION_REPORT:</div>
              <p>${escapeHtml(t.report)}</p>
            </div>
          `;
        }

        let actionHtml = '';
        if (currentRole === 'executor' && status === 'pending') {
          actionHtml = `
            <div class="task-actions" id="actions-${t.id}">
              <button class="btn btn-success" onclick="openReportBox('${t.id}')">Execute & Report</button>
            </div>
            <div id="reportBox-${t.id}" class="task-report-box" style="display:none; margin-top:12px; flex-direction:column; gap:8px; background:transparent; border-color:var(--brand)">
              <textarea id="txtReport-${t.id}" class="form-control" placeholder="Enter execution log/report..."></textarea>
              <div style="display:flex; gap:8px">
                <button class="btn btn-primary" onclick="submitReport('${t.id}')">Submit Report</button>
                <button class="btn" onclick="cancelReport('${t.id}')">Cancel</button>
              </div>
            </div>
          `;
        }

        return `
          <div class="task-item">
            <div class="task-header">
              <div>
                <h3 class="task-title">${escapeHtml(t.title)}</h3>
                <div class="task-meta">ID: ${t.id} | ${date}</div>
              </div>
              <span class="badge badge-${status}">${status}</span>
            </div>
            <p class="task-desc">${escapeHtml(t.desc)}</p>
            ${reportHtml}
            ${actionHtml}
          </div>
        `;
      }).join('');

      // Hide all report boxes initially
      document.querySelectorAll('[id^="reportBox-"]').forEach(el => el.style.display = 'none');
    }

    function openReportBox(id) {
      document.getElementById('actions-' + id).style.display = 'none';
      document.getElementById('reportBox-' + id).style.display = 'flex';
    }

    function cancelReport(id) {
      document.getElementById('actions-' + id).style.display = 'flex';
      document.getElementById('reportBox-' + id).style.display = 'none';
    }

    async function submitReport(id) {
      const report = document.getElementById('txtReport-' + id).value;
      if (!report.trim()) {
        alert("Report cannot be empty");
        return;
      }
      const res = await fetch('/api/project/task/update', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({id: id, status: 'completed', report: report})
      });
      const data = await res.json();
      if (data.ok) {
        fetchTasks();
      } else {
        alert('Failed to submit report: ' + data.error);
      }
    }

    function escapeHtml(unsafe) {
      return (unsafe||"").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    window.onload = init;
  </script>
</body>
</html>
