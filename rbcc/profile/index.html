<!--rebuilt5525--><!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人档案 · 石榴籽数字人画像</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23fff8f5'/%3E%3Ccircle cx='32' cy='36' r='20' fill='%23c51d3a'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0}
:root{--ink:#171015;--paper:#fff8f5;--line:#f0c9c2;--muted:#75646a;--pome:#c51d3a;--leaf:#1f8a70;--gold:#d48a18;--blue:#244c9a;--shadow:0 18px 50px rgba(126,16,39,.12)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);
background:linear-gradient(90deg,rgba(197,29,58,.045) 1px,transparent 1px),linear-gradient(180deg,rgba(197,29,58,.035) 1px,transparent 1px),linear-gradient(180deg,#fffdfa,#fff1ee 55%,#f7fffb);background-size:28px 28px,28px 28px,auto}
.wrap{max-width:980px;margin:0 auto;padding:40px 22px 80px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:34px}
.top h1{font-size:1.6em}
.top h1 small{display:block;font-size:.55em;font-weight:400;color:var(--muted);margin-top:6px;letter-spacing:.02em}
.nav a{font-size:.88em;color:var(--pome);text-decoration:none;font-weight:600;background:rgba(197,29,58,.07);border:1px solid var(--line);padding:8px 16px;border-radius:99px;margin-left:8px}
.intro{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 24px;box-shadow:var(--shadow);color:var(--muted);font-size:.92em;line-height:1.8;margin-bottom:36px}
.intro b{color:var(--ink)}
.pc{background:#fff;border:1px solid var(--line);border-radius:22px;padding:32px 30px;margin-bottom:28px;box-shadow:var(--shadow)}
.phead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.avatar{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8da0,var(--pome));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.05em;flex:none}
.pname{font-size:1.2em;font-weight:700}
.pscene{font-size:.78em;font-weight:600;color:var(--leaf);background:rgba(31,138,112,.1);border-radius:99px;padding:3px 12px}
.metrics{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 4px;font-size:.84em;color:var(--muted)}
.metrics b{color:var(--pome);font-size:1.05em;font-variant-numeric:tabular-nums}
.quote{font-size:1.06em;line-height:1.7;color:var(--pome-d);font-weight:650;border-left:3px solid var(--pome);padding:4px 0 4px 14px;margin:16px 0 20px}
.sec{margin:18px 0}
.sec h3{font-size:.8em;color:var(--muted);letter-spacing:.16em;margin-bottom:8px}
.sec p{line-height:1.85;font-size:.95em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:.8em;padding:5px 13px;border-radius:99px;border:1px solid var(--line)}
.chip.c1{background:rgba(197,29,58,.07);color:var(--pome)}
.chip.c2{background:rgba(31,138,112,.08);color:var(--leaf)}
.chip.c3{background:rgba(212,138,24,.09);color:var(--gold)}
.evi{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.evi h3{font-size:.8em;color:var(--muted);letter-spacing:.16em;margin-bottom:10px}
.evi li{font-size:.86em;color:var(--muted);line-height:1.9;list-style:none}
.evi li::before{content:"◈ ";color:var(--pome)}
.foot{margin-top:44px;text-align:center;color:var(--muted);font-size:.82em}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>个人档案 · 数字人画像<small id="genAt"></small></h1>
    <nav class="nav"><a href="/rbcc/">← 项目主页</a><a href="/rbcc/insights/">知识库</a><a href="/rbcc/survey/">问卷</a></nav>
  </div>
  <div class="intro">以下档案由 <b>DeepSeek 大模型</b>对各场景<b>代表数字人</b>的公开内容（帖文摘录、产出与互动数据）进行行为分析自动生成，包含身份推断、性格标签、表达风格与核心主题。所有个体均已匿名化，分析仅基于公开信息。</div>
  <div id="list">加载中…</div>
  <div class="foot">RBCC 石榴籽项目 · AI 画像仅供研究参考</div>
</div>
<script>
fetch('profiles.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  document.getElementById('genAt').textContent='生成时间：'+d.generated_at+' · '+d.profiles.length+' 份档案';
  document.getElementById('list').innerHTML=d.profiles.map(p=>{
    const a=p.analysis;
    const chips=(arr,cls)=>(arr||[]).map(x=>`<span class="chip ${cls}">${x}</span>`).join('');
    return `<div class="pc">
      <div class="phead">
        <div class="avatar">${p.anon_name.replace('石榴籽#','')}</div>
        <div><div class="pname">${p.anon_name}</div></div>
        <span class="pscene">${p.scene}</span>
      </div>
      <div class="metrics">
        <span>公开帖文 <b>${p.post_count}</b> 篇</span>
        <span>累计字数 <b>${(p.total_chars/10000).toFixed(1)}</b> 万</span>
        <span>粉丝 <b>${p.follower_count>9999?(p.follower_count/10000).toFixed(0)+' 万':p.follower_count}</b></span>
      </div>
      <div class="quote">${a.summary}</div>
      <div class="sec"><h3>身份推断</h3><p>${a.identity}</p></div>
      <div class="sec"><h3>性格标签</h3><div class="chips">${chips(a.personality,'c1')}</div></div>
      <div class="sec"><h3>兴趣领域</h3><div class="chips">${chips(a.interests,'c2')}</div></div>
      <div class="sec"><h3>表达风格</h3><p>${a.style}</p></div>
      <div class="sec"><h3>行为模式</h3><p>${a.behavior}</p></div>
      <div class="sec"><h3>核心主题</h3><div class="chips">${chips(a.themes,'c3')}</div></div>
      <div class="evi"><h3>分析依据（公开帖文标题摘录）</h3><ul>${(p.evidence_titles||[]).map(t=>`<li>${t}</li>`).join('')}</ul></div>
    </div>`;
  }).join('');
}).catch(e=>{document.getElementById('list').textContent='加载失败：'+e});
</script>
</body>
</html>
