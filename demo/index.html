<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demos · Xu Wang</title>
<meta name="description" content="Xu Wang 的交互实验小站，收录我的一些 Demo 与原型。">
<style>
  :root{
    color-scheme: light dark;
    --bg: light-dark(#fafaf8, #151515);
    --card: light-dark(#ffffff, #1e1e1e);
    --line: light-dark(rgba(0,0,0,.08), rgba(255,255,255,.1));
    --ink: light-dark(#1b1d20, #eef0f3);
    --muted: light-dark(#6b7280, #9aa1ad);
    --accent: #3a7bff;
    --accent-soft: rgba(58,123,255,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 20px 72px}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--line);margin-bottom:36px}
  .brand{font-weight:700;letter-spacing:.2px}
  .back{color:var(--muted);text-decoration:none;font-size:.9rem}
  .back:hover{color:var(--accent)}
  h1{font-size:1.7rem;margin:0 0 6px}
  .lead{color:var(--muted);font-size:1rem;margin:0 0 32px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
  .card{
    display:flex;flex-direction:column;justify-content:space-between;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;
    text-decoration:none;color:inherit;transition:transform .15s ease, box-shadow .15s ease;
  }
  a.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.08)}
  .card .tag{font-size:.72rem;font-weight:600;letter-spacing:.4px;color:var(--accent);
    background:var(--accent-soft);padding:3px 9px;border-radius:999px;align-self:flex-start}
  .card h3{margin:0;font-size:1.05rem}
  .card p{margin:0;color:var(--muted);font-size:.88rem;flex:1}
  .card .go{font-size:.8rem;color:var(--accent);font-weight:600}
  .placeholder{opacity:.55;cursor:default;border-style:dashed}
  .placeholder a{text-decoration:none;color:inherit}
  footer{margin-top:48px;color:var(--muted);font-size:.82rem;border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Demos · Xu Wang</div>
    <a class="back" href="/" rel="noopener noreferrer">← 返回主页</a>
  </header>

  <h1>交互实验 / Demo</h1>
  <p class="lead">一些有意思的小实验、可交互的原型与小玩具。点击卡片即可打开。</p>

  <div class="grid">

    <!-- ===== 在此继续添加新的 demo 卡片即可，复制下面这块并修改链接与文字 ===== -->
    <a class="card" href="/fork-lab.html" target="_blank" rel="noopener noreferrer">
      <span class="tag">LAB</span>
      <h3>Fork Lab</h3>
      <p>一个可交互的实验沙盒 / 可视化小工具。</p>
      <span class="go">打开 →</span>
    </a>

    <div class="card placeholder">
      <div>
        <span class="tag">DEMO</span>
        <h3>示例位置 01</h3>
        <p>这里放一个你正在做的 demo 截图与一句话简介，并链接到对应页面。</p>
      </div>
      <span class="go" style="color:var(--muted)">待补充</span>
    </div>

    <div class="card placeholder">
      <div>
        <span class="tag">DEMO</span>
        <h3>示例位置 02</h3>
        <p>同样的卡片，复制上面的结构，把链接填进去即可，多个 demo 会自动排成一列网格。</p>
      </div>
      <span class="go" style="color:var(--muted)">待补充</span>
    </div>

  </div>

  <footer>
    <span>© <span id="yr"></span> Xu Wang</span>
    <a class="back" href="/" rel="noopener noreferrer">wangxu.life</a>
  </footer>
</div>

<script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
