<title>Love Diary · Xu Wang</title>

<style>
  :root{color-scheme:light dark;--bg:light-dark(#fffaf3,#16120c);--card:light-dark(#ffffff,#1f1a13);--ink:light-dark(#2b2620,#f0ece4);--muted:light-dark(#8a7f70,#a79e90);--line:light-dark(rgba(0,0,0,.07),rgba(255,255,255,.09))}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px 72px}
  header{display:flex;align-items:center;justify-content:space-between;padding:22px 0;border-bottom:1px solid var(--line);margin-bottom:28px}
  .brand{font-weight:700;letter-spacing:.3px}
  .back{color:var(--muted);text-decoration:none;font-size:.9rem}.back:hover{opacity:.8}
  h1{font-size:1.6rem;margin:0 0 6px;letter-spacing:.4px}
  .lead{color:var(--muted);margin:0 0 26px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .grid figure{margin:0;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line);aspect-ratio:1/1}
  .grid img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
  .grid figure:hover img{transform:scale(1.04)}
  footer{margin-top:44px;color:var(--muted);font-size:.82rem;border-top:1px solid var(--line);padding-top:16px;text-align:center}
</style>
