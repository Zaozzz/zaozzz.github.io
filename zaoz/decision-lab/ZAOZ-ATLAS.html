    {id:'p6',name:'数据观察台',short:'数据观察',owner:'数据团队',cost:16,people:5,weeks:3,risk:20,growth:64,resilience:78,experience:72,deps:[],evidence:['e1','e5'],description:'建立可复用的指标与异常观察能力，为后续自动化提效提供数据基础。'},
    {id:'p7',name:'安全与质量审计',short:'安全审计',owner:'质量团队',cost:14,people:4,weeks:2,risk:8,growth:28,resilience:94,experience:65,deps:[],evidence:['e1','e6'],description:'核对关键风险、验收标准与安全约束。作为本演练所有方案的固定必选项目。'},
    {id:'p8',name:'自动化提效',short:'自动化',owner:'研发团队',cost:26,people:8,weeks:5,risk:27,growth:77,resilience:75,experience:68,deps:['p6'],evidence:['e1','e5'],description:'在数据观察台具备基础能力后，对重复流程进行自动化，减少人工整理与交接成本。'}
  ];
  const scenarios={
    launch:{name:'新品上市',title:'增长机会，先配好交付能力。',brief:'下一季度计划推出新产品。有限的预算和团队投入，需要在新增长、现有客户与交付稳定性之间取舍。',budget:120,capacity:40,horizon:12,risk:36,weights:{growth:55,resilience:20,experience:25},mandatory:['p7'],event:'需求窗口缩短 2 周，项目成本上浮 8%。'},
    supply:{name:'供应受阻',title:'先守住交付，再寻找增长。',brief:'核心供应不稳定，需要建立双源保障，同时保留客户服务能力。先确认必做事项，再比较剩余资源的去向。',budget:104,capacity:36,horizon:13,risk:27,weights:{growth:20,resilience:60,experience:20},mandatory:['p2','p7'],event:'备选供应验证延长 2 周，项目成本上浮 10%。'},
    tight:{name:'预算收紧',title:'资源减少时，保留最有用的行动。',brief:'预算与团队投入受限。优先守住质量和客户体验，明确本轮选择以及需要延后的项目。',budget:76,capacity:26,horizon:10,risk:25,weights:{growth:25,resilience:40,experience:35},mandatory:['p7'],event:'可用预算临时减少 20%，人力与期限保持不变。'}
  };
  const policies=[{id:'recommended',name:'当前目标优先',note:'按你设定的目标权重，寻找可行范围内贡献最高的组合。'}, {id:'resilient',name:'韧性优先',note:'提高韧性权重，比较更重视稳定性的选择。',weights:{growth:15,resilience:70,experience:15}}, {id:'growth',name:'增长优先',note:'提高增长权重，检视机会与风险之间的取舍。',weights:{growth:75,resilience:10,experience:15}}];
  const find=id=>projects.find(p=>p.id===id);
  const defaults=scenario=>({scenario,budget:scenarios[scenario].budget,capacity:scenarios[scenario].capacity,horizon:scenarios[scenario].horizon,risk:scenarios[scenario].risk,weights:{...scenarios[scenario].weights},shock:false,locked:[],excluded:[]});
  function effective(config){return {...config,budget:config.shock&&config.scenario==='tight'?Math.floor(config.budget*.8):config.budget,horizon:config.shock&&config.scenario==='launch'?config.horizon-2:config.horizon,costFactor:config.shock?(config.scenario==='launch'?1.08:config.scenario==='supply'?1.1:1):1};}
  function evaluate(mask,config){
    const env=effective(config),items=projects.filter((p,i)=>mask&(1<<i)),ids=items.map(p=>p.id),reasons=[];
    const sum=k=>items.reduce((n,p)=>n+p[k],0),cost=Math.round(sum('cost')*env.costFactor*10)/10,people=sum('people');
    const risk=cost?items.reduce((n,p)=>n+p.cost*p.risk,0)/sum('cost'):0;
    const required=[...new Set([...scenarios[config.scenario].mandatory,...config.locked])];
    if(!items.length)reasons.push('至少选择一个项目');
    required.forEach(id=>{if(!ids.includes(id))reasons.push('缺少必选：'+find(id).name);});
    config.excluded.forEach(id=>{if(ids.includes(id))reasons.push('包含已排除项目：'+find(id).name);});
    items.forEach(p=>p.deps.forEach(id=>{if(!ids.includes(id))reasons.push(p.name+' 缺少前置 '+find(id).name);}));
    if(cost>env.budget+1e-8)reasons.push('预算超出 '+Number((cost-env.budget).toFixed(1))+' 万元');
    if(people>env.capacity)reasons.push('人力超出 '+(people-env.capacity)+' 人周');
    if(risk>env.risk+1e-8)reasons.push('组合风险超过上限');
    const schedule={},finish=id=>{if(schedule[id])return schedule[id].end;const p=find(id);const start=p.deps.filter(d=>ids.includes(d)).reduce((n,d)=>Math.max(n,finish(d)),0);const duration=p.weeks+(config.shock&&config.scenario==='supply'&&id==='p2'?2:0);schedule[id]={start,end:start+duration};return start+duration;};
    items.forEach(p=>finish(p.id));
    const weeks=items.reduce((n,p)=>Math.max(n,schedule[p.id].end),0);
    if(weeks>env.horizon)reasons.push('前置依赖后的工期超出 '+(weeks-env.horizon)+' 周');
    const dims={growth:sum('growth'),resilience:sum('resilience'),experience:sum('experience')};
    const sources=[...new Set(items.flatMap(p=>p.evidence))].map(id=>evidence.find(e=>e.id===id));
    const coverage=sources.length?Math.round(sources.filter(e=>e.status==='ready').length/sources.length*100):0;
    return {mask,items,ids,cost,people,risk:Math.round(risk*10)/10,weeks,schedule,dims,sources,coverage,reasons,feasible:reasons.length===0};
  }
  function score(plan,weights){const total=weights.growth+weights.resilience+weights.experience;return Object.keys(plan.dims).reduce((n,k)=>n+plan.dims[k]*weights[k]/total,0);}
  function solve(config){
    const candidates=[];for(let mask=1;mask<(1<<projects.length);mask++){const p=evaluate(mask,config);if(p.feasible)candidates.push(p);}
    const options=policies.map(policy=>{const weights=policy.weights||config.weights;const sorted=candidates.slice().sort((a,b)=>score(b,weights)-score(a,weights)||a.cost-b.cost||a.mask-b.mask);const plan=sorted[0]||null;return {...policy,weights,plan,score:plan?score(plan,config.weights):0};});
    return {options,candidates,count:candidates.length,total:(1<<projects.length)-1,env:effective(config)};
  }
  function validateConfig(c){
    if(!c||!Object.prototype.hasOwnProperty.call(scenarios,c.scenario))throw new Error('未知演练场景');
    for(const [k,lo,hi] of [['budget',40,200],['capacity',12,64],['horizon',6,18],['risk',10,55]])if(typeof c[k]!=='number'||!Number.isFinite(c[k])||c[k]<lo||c[k]>hi)throw new Error('参数不合法：'+k);
    if(!c.weights||!['growth','resilience','experience'].every(k=>typeof c.weights[k]==='number'&&Number.isFinite(c.weights[k])&&c.weights[k]>=0&&c.weights[k]<=100)||['growth','resilience','experience'].reduce((sum,k)=>sum+c.weights[k],0)<=0)throw new Error('目标权重须在 0–100 且不能全部为零');
    if(typeof c.shock!=='boolean')throw new Error('压力事件格式不正确');
    for(const k of ['locked','excluded'])if(!Array.isArray(c[k])||c[k].length>projects.length||!c[k].every(id=>typeof id==='string'&&find(id))||new Set(c[k]).size!==c[k].length)throw new Error('项目约束格式不正确');
    if(c.locked.some(id=>c.excluded.includes(id)))throw new Error('同一项目不能同时必选和排除');
    return {scenario:c.scenario,budget:c.budget,capacity:c.capacity,horizon:c.horizon,risk:c.risk,weights:{growth:c.weights.growth,resilience:c.weights.resilience,experience:c.weights.experience},shock:c.shock,locked:[...c.locked],excluded:[...c.excluded]};
  }
  return {projects,evidence,scenarios,policies,find,defaults,effective,evaluate,score,solve,validateConfig};
});

<script>
/* ATLAS is an interactive, browser-local decision rehearsal, not a live approval service. */
(() => {
  'use strict';
  const E=window.AtlasEngine,KEY='zaoz.atlas.v1',VERSION=1;
  const $=s=>document.querySelector(s),escape=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const routes=['overview','scenarios','portfolio','evidence','execution','history'];
  const labels={overview:'决策总览',scenarios:'方案推演',portfolio:'项目组合',evidence:'依据与风险',execution:'审批与执行',history:'决策记录'};
  const fmt=n=>Number(n.toFixed(1)).toLocaleString('zh-CN');
  const makeState=()=>({version:VERSION,config:E.defaults('launch'),selected:'recommended',approval:null,tasks:{},history:[]});
  let storageOK=true,state=makeState(),route=routes.includes(location.hash.slice(1))?location.hash.slice(1):'overview',model,plan,toastTimer;
  function cleanHistory(list){return Array.isArray(list)?list.slice(0,100).filter(x=>x&&typeof x.title==='string'&&typeof x.detail==='string'&&typeof x.at==='string').map(x=>({title:x.title.slice(0,100),detail:x.detail.slice(0,1500),at:x.at.slice(0,40)})):[];}
  try{const raw=localStorage.getItem(KEY);if(raw){const saved=JSON.parse(raw);if(saved.version===VERSION){state={...makeState(),config:E.validateConfig(saved.config),selected:E.policies.some(p=>p.id===saved.selected)?saved.selected:'recommended',approval:saved.approval,tasks:saved.tasks&&typeof saved.tasks==='object'?saved.tasks:{},history:cleanHistory(saved.history)};}}}catch(e){storageOK=false;}
  function compute(){model=E.solve(state.config);plan=(model.options.find(p=>p.id===state.selected)||model.options[0]).plan;}
  function signature(){return JSON.stringify([state.config,plan?plan.mask:null]);}
  function approved(){return Boolean(plan&&state.approval&&state.approval.signature===signature());}
  compute();
  if(!state.approval||typeof state.approval.note!=='string'||!approved()){state.approval=null;state.tasks={};}
  else{const safe={};plan.items.slice().sort((a,b)=>plan.schedule[a.id].start-plan.schedule[b.id].start).forEach(p=>{const s=state.tasks[p.id];if(['active','done'].includes(s)&&p.deps.every(d=>safe[d]==='done'))safe[p.id]=s;});state.tasks=safe;}
  function log(title,detail){state.history.unshift({at:new Date().toISOString(),title,detail});state.history=state.history.slice(0,100);}
  if(!state.history.length)log('建立演练工作空间','加载虚构的远川设备项目组合；当前没有执行授权。');
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}const node=$('#saveStatus');node.textContent=storageOK?'已保存在此浏览器':'当前无法持久保存';node.classList.toggle('warning',!storageOK);}
  function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').classList.add('visible');toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),3600);}
  function navigate(next){if(!routes.includes(next))return;if(location.hash.slice(1)!==next)location.hash=next;else{route=next;render();}window.scrollTo({top:0,behavior:'instant'});}
  function changeConfig(next,title,detail){try{const config=E.validateConfig(next);const wasApproved=approved();state.config=config;state.selected='recommended';state.approval=null;state.tasks={};compute();log(title,detail+(wasApproved?'；已撤销旧条件下的审批和执行状态。':''));save();render();toast(wasApproved?'条件已更新，旧审批已失效。':'已按新条件重新推演。');}catch(e){toast(e.message);}}
  function scenarioControl(){return `<label class="scenario-select">切换决策情境<select id="scenarioSelect" aria-label="决策情境">${Object.entries(E.scenarios).map(([id,s])=>`<option value="${id}" ${state.config.scenario===id?'selected':''}>${s.name}</option>`).join('')}</select></label>`;}
  function heading(eyebrow,title,subtitle){return `<div class="page-heading"><div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p class="subtle">${subtitle}</p></div>${scenarioControl()}</div>`;}
  function panel(title,body,extra=''){return `<section class="panel ${extra}"><div class="panel-head"><h2>${title}</h2></div>${body}</section>`;}
  function selectedName(){return model.options.find(o=>o.id===state.selected).name;}
  function metric(label,number,unit,caption,progress){return `<article class="metric"><label>${label}</label><div class="number">${number}<small>${unit}</small></div>${progress!==undefined?`<div class="meter"><i style="width:${Math.min(100,Math.max(0,progress))}%"></i></div>`:''}<div class="caption">${caption}</div></article>`;}
  function metrics(){const env=model.env;return `<div class="metrics">${metric('本轮预算占用',plan?fmt(plan.cost):'—','/ '+fmt(env.budget)+' 万元',plan?'预留 '+fmt(env.budget-plan.cost)+' 万元缓冲':'尚无满足约束的组合',plan?plan.cost/env.budget*100:0)}${metric('团队总投入',plan?plan.people:'—','/ '+env.capacity+' 人周','人周是总投入，不代表并行人数',plan?plan.people/env.capacity*100:0)}${metric('依赖工期',plan?plan.weeks:'—','/ '+env.horizon+' 周','按前置关系计算最早完工时间',plan?plan.weeks/env.horizon*100:0)}${metric('已核对资料覆盖',plan?plan.coverage:'—','%',plan?plan.sources.filter(s=>s.status==='ready').length+' / '+plan.sources.length+' 份关联示例资料':'核对资料后再作判断',plan?plan.coverage:0)}</div>`;}
  function infeasible(){const required=[...new Set([...E.scenarios[state.config.scenario].mandatory,...state.config.locked])];let mask=0;function add(id){const p=E.find(id);mask|=1<<E.projects.indexOf(p);p.deps.forEach(add);}required.forEach(add);const reasons=E.evaluate(mask,state.config).reasons;return `<div class="empty"><strong>当前条件下没有可行组合</strong><p>已遍历 ${model.total} 个项目组合。可调整资源、期限或必选与排除条件。</p>${reasons.map(r=>`<div class="issue">${escape(r)}</div>`).join('')}<button class="secondary" data-route="scenarios">调整推演条件 →</button></div>`;}
  function alertItems(){const a=[];if(!plan)return [{title:'当前条件互相冲突',note:'请检查预算、前置依赖、期限和项目必选条件。',icon:'!'}];if(state.config.shock)a.push({title:'压力事件已生效',note:E.scenarios[state.config.scenario].event,icon:'↯'});if(model.env.budget-plan.cost<model.env.budget*.15)a.push({title:'预算缓冲偏小',note:'剩余 '+fmt(model.env.budget-plan.cost)+' 万元；若假设变化，可比较稳健方案。',icon:'!'});const missing=plan.sources.filter(s=>s.status!=='ready');if(missing.length)a.push({title:missing.length+' 份关联资料需要复核',note:missing.map(s=>s.name).join('、'),icon:'⌕'});if(!approved())a.push({title:'等待本人确认方案',note:'完成资料与资源核对后，才能进入执行演练。',icon:'○'});else a.push({title:'本轮方案已确认',note:'确认只在演练中生效；可以继续跟进或撤回。',icon:'✓'});if(a.length<3)a.push({title:'持续保留质量底线',note:'安全与质量审计为必选项，所有组合均检查前置依赖。',icon:'◇'});return a;}
  function alerts(){return `<ul class="alert-list">${alertItems().map(a=>`<li><span class="alert-icon" aria-hidden="true">${a.icon}</span><div>${a.title}<small>${escape(a.note)}</small></div></li>`).join('')}</ul>`;}
  function frontier(){if(!plan)return infeasible();const maxScore=Math.max(...model.candidates.map(p=>E.score(p,state.config.weights)),1)*1.1;const x=n=>42+n/model.env.budget*450,y=n=>205-n/maxScore*170;const marks=model.candidates.map(p=>`<circle cx="${x(p.cost)}" cy="${y(E.score(p,state.config.weights))}" r="3" fill="#ccd4c7"><title>投入 ${p.cost} 万元；目标贡献 ${fmt(E.score(p,state.config.weights))}；${p.items.length} 项目</title></circle>`).join('');return `<div class="chart"><svg viewBox="0 0 540 245" role="img" aria-label="可行组合的成本与目标贡献比较，橙色点为当前方案"><title>成本与目标贡献</title>${[0,.5,1].map(t=>`<path d="M42 ${y(t*maxScore)}H500" stroke="#e7e9df"/><text x="32" y="${y(t*maxScore)+4}" text-anchor="end" font-size="9" fill="#899383">${Math.round(t*maxScore)}</text>`).join('')}<path d="M42 28V205H500" stroke="#c9cec3" fill="none"/>${marks}<circle cx="${x(plan.cost)}" cy="${y(E.score(plan,state.config.weights))}" r="6" fill="#b74e2f" stroke="#fffefa" stroke-width="2"/><text x="42" y="16" font-size="10" fill="#68796b">目标贡献（加权分）</text><text x="42" y="225" font-size="9" fill="#899383">0</text><text x="500" y="225" text-anchor="end" font-size="9" fill="#899383">${fmt(model.env.budget)} 万元</text></svg></div><div class="legend"><span><i style="background:#b74e2f"></i>当前选择</span><span><i style="background:#ccd4c7"></i>${model.count} 个满足约束的组合</span></div>`;}
  function timeline(){if(!plan)return '';const width=500,left=106,span=370,max=Math.max(model.env.horizon,plan.weeks,1),rows=plan.items.slice().sort((a,b)=>plan.schedule[a.id].start-plan.schedule[b.id].start);return `<div class="chart"><svg viewBox="0 0 ${width} ${rows.length*34+36}" role="img" aria-label="所选项目的前置依赖与最早排期"><title>前置依赖排期示意</title>${[0,.5,1].map(t=>`<text x="${left+t*span}" y="12" text-anchor="middle" font-size="9" fill="#899383">第 ${fmt(t*max)} 周</text><path d="M${left+t*span} 23V${rows.length*34+23}" stroke="#eeeee7"/>`).join('')}${rows.map((p,i)=>{const s=plan.schedule[p.id],yy=27+i*34;return `<text x="0" y="${yy+15}" font-size="10" fill="#586a5a">${p.short}</text><rect x="${left+s.start/max*span}" y="${yy}" width="${(s.end-s.start)/max*span}" height="22" rx="3" fill="${p.deps.length?'#78907b':'#b0be9e'}"/><text x="${left+s.start/max*span+7}" y="${yy+15}" fill="white" font-size="9">${s.end-s.start} 周</text>`;}).join('')}</svg></div><p class="subtle section-gap">按前置完成后启动计算；暂不模拟周度并行资源调度。</p>`;}
  function overview(){const s=E.scenarios[state.config.scenario];return heading('01 / Decision overview','把复杂取舍，变成清晰的下一步。',s.brief)+metrics()+`<div class="two-col"><section class="panel recommendation"><div class="panel-head"><span class="tiny-label">本轮建议 / ${selectedName()}</span><span class="tag">${approved()?'已确认':'待审阅'}</span></div>${plan?`<h2>${s.title}</h2><p>在当前条件下，选择 ${plan.items.length} 个项目，投入 ${fmt(plan.cost)} 万元与 ${plan.people} 人周，依赖工期 ${plan.weeks} 周。目标贡献 ${fmt(E.score(plan,state.config.weights))} 分，组合风险 ${plan.risk} / ${model.env.risk}。</p><div class="selection-chips">${plan.items.map(p=>`<button class="chip" data-project="${p.id}">${p.short} ↗</button>`).join('')}</div><div class="actions"><button class="primary" data-route="scenarios">比较方案与取舍 →</button><button class="text-button" data-route="execution">${approved()?'进入执行演练':'审阅并确认'}</button></div>`:infeasible()}</section>${panel('主动观察',alerts())}</div><div class="equal-col">${panel('每一分资源，换来什么',frontier())}${panel('从条件到行动',`<p class="subtle">当前已检查全部 ${model.total} 种非空组合，其中 ${model.count} 种满足预算、人周、期限、风险与依赖约束。</p><div class="flow"><div class="flow-step active"><span>01</span>明确约束</div><span class="flow-arrow">→</span><div class="flow-step active"><span>02</span>比较方案</div><span class="flow-arrow">→</span><div class="flow-step ${approved()?'active':''}"><span>03</span>本人确认</div><span class="flow-arrow">→</span><div class="flow-step"><span>04</span>跟进执行</div></div><p class="subtle section-gap">你可以调整情境、改变资源和偏好，也可以锁定或排除项目。计算结果会随条件更新，旧审批自动失效。</p><button class="text-button" data-action="guide">第一次体验？查看 3 分钟指引 ↗</button>`)}</div>`;}
  function slider(name,label,value,min,max,unit){return `<label class="control"><span class="control-label">${label}<output for="${name}">${value}${unit}</output></span><input id="${name}" name="${name}" type="range" min="${min}" max="${max}" step="1" value="${value}" data-unit="${unit}"><span class="range-hint"><span>${min}${unit}</span><span>${max}${unit}</span></span></label>`;}
  function planCards(){return `<div class="plan-grid">${model.options.map(o=>`<article class="plan-card ${state.selected===o.id?'selected':''}"><div><span class="tag ${state.selected===o.id?'':'gray'}">${state.selected===o.id?'当前选择':'可比较方案'}</span></div><h3 class="section-gap">${o.name}</h3><p>${o.note}</p>${o.plan?`<div class="plan-score">${fmt(o.score)}<small>目标贡献</small></div><div class="plan-stat"><span>预算</span><b>${fmt(o.plan.cost)} 万</b></div><div class="plan-stat"><span>总投入</span><b>${o.plan.people} 人周</b></div><div class="plan-stat"><span>组合风险</span><b>${o.plan.risk}</b></div><div class="plan-stat"><span>依赖工期</span><b>${o.plan.weeks} 周</b></div><div class="plan-names">${o.plan.items.map(p=>p.short).join(' · ')}${o.id!=='recommended'&&o.plan.mask===model.options[0].plan?.mask?'<br>与当前目标方案的项目相同。':''}</div><button class="${state.selected===o.id?'primary':'secondary'}" data-plan="${o.id}">${state.selected===o.id?'已选此方案':'选择此方案'}</button>`:'<div class="empty">没有可行组合</div>'}</article>`).join('')}</div>`;}
  function scenarios(){const c=state.config;return heading('02 / Scenario studio','把条件摆出来，把方案算清楚。','改变资源、目标和外部事件，查看约束如何改变行动组合。')+`<div class="settings-layout"><section class="panel controls"><div class="panel-head"><h2>本轮条件</h2><span class="tag gray">可调整</span></div><form id="configForm">${slider('budget','预算',c.budget,40,200,' 万元')}${slider('capacity','团队总投入',c.capacity,12,64,' 人周')}${slider('horizon','完成期限',c.horizon,6,18,' 周')}${slider('risk','组合风险上限',c.risk,10,55,'')}<hr class="control-divider"><div class="full"><p class="tiny-label">目标偏好 / 自动归一化为权重</p></div>${slider('growth','增长',c.weights.growth,0,100,'')}${slider('resilience','韧性',c.weights.resilience,0,100,'')}${slider('experience','客户体验',c.weights.experience,0,100,'')}<div class="full"><button class="primary" type="submit">重新推演 →</button></div></form></section><div><button class="stress-button" data-action="shock" aria-pressed="${c.shock}"><b>${c.shock?'✓ 压力事件已开启':'↯ 加入一次压力事件'}</b><br>${E.scenarios[c.scenario].event}</button>${planCards()}${panel('选择背后的理由',plan?`<div class="explanation"><p>当前选择 <b>${plan.items.length} 个项目</b>；预算剩余 <b>${fmt(model.env.budget-plan.cost)} 万元</b>，人力剩余 <b>${model.env.capacity-plan.people} 人周</b>。前置项目均已纳入，工期和风险未超过上限。</p><p>三种方案的“目标贡献”统一按你的当前权重计算，以便比较。韧性优先与增长优先只改变搜索偏好，不改变资源与风险上限。</p><p>分数是演练项目的相对贡献之和，不代表收益金额、成功概率或真实效果预测。</p><button class="text-button" data-route="execution">审阅此方案并进入确认 →</button></div>`:infeasible(),'section-gap')}<div class="section-gap">${panel('可行方案分布',frontier())}</div></div></div>`;}
  function portfolio(){return heading('03 / Portfolio','选什么，也要知道暂缓什么。','查看八个候选项目；可调整必选与排除条件，并检查资源和前置关系。')+`<div class="brief-note">场景固定必选：${E.scenarios[state.config.scenario].mandatory.map(id=>E.find(id).name).join('、')}。排除某项前置项目时，依赖它的组合将自动判为不可行。</div><section class="panel"><div class="filter-bar"><input id="projectSearch" type="search" placeholder="搜索项目、团队或关键词" aria-label="搜索项目"><span class="tag">${plan?plan.items.length:0} / ${E.projects.length} 项纳入当前方案</span></div><div class="table-wrap"><table><thead><tr><th>项目与负责团队</th><th>预算 / 万元</th><th>人周</th><th>周期</th><th>风险</th><th>当前方案</th><th>选择条件</th></tr></thead><tbody>${E.projects.map(p=>`<tr data-search="${escape(p.name+p.owner+p.description)}"><td><button class="table-row-button" data-project="${p.id}"><span class="project-name">${p.name} ↗<small>${p.owner}${p.deps.length?' · 前置：'+p.deps.map(d=>E.find(d).short).join('、'):''}</small></span></button></td><td class="mono">${fmt(p.cost*model.env.costFactor)}</td><td>${p.people}</td><td>${p.weeks+(state.config.shock&&state.config.scenario==='supply'&&p.id==='p2'?2:0)} 周</td><td>${p.risk}</td><td><span class="tag ${plan?.ids.includes(p.id)?'':'gray'}">${plan?.ids.includes(p.id)?'纳入':'暂缓'}</span></td><td><select data-constraint="${p.id}" aria-label="${p.name}选择条件" ${E.scenarios[state.config.scenario].mandatory.includes(p.id)?'disabled':''}><option value="optional" ${!state.config.locked.includes(p.id)&&!state.config.excluded.includes(p.id)?'selected':''}>自动比较</option><option value="locked" ${state.config.locked.includes(p.id)||E.scenarios[state.config.scenario].mandatory.includes(p.id)?'selected':''}>必须纳入</option><option value="excluded" ${state.config.excluded.includes(p.id)?'selected':''}>本轮排除</option></select></td></tr>`).join('')}</tbody></table></div><p id="searchEmpty" class="empty" hidden>没有匹配的项目。</p></section><div class="section-gap">${panel('所选项目的前置与时间关系',plan?timeline():infeasible())}</div>`;}
  function evidenceView(){return heading('04 / Evidence & risk','看清依据，也看清还不知道什么。','所有资料均为演练样例；状态表示样例中的核对情况，不能视为真实企业证据。')+`<div class="two-col">${panel('资料目录',`<div class="evidence-list">${E.evidence.map(e=>`<article class="evidence-card"><div class="panel-head" style="margin-bottom:5px"><h3>${e.name}</h3><span class="tag ${e.status==='ready'?'':'orange'}">${e.label}</span></div><div class="evidence-meta"><span>${e.kind}</span><span>虚构演练资料</span><span>${plan?.sources.some(s=>s.id===e.id)?'关联当前方案':'未关联当前方案'}</span></div><p>${e.note}</p><button class="text-button" data-evidence="${e.id}">查看引用项目与核对问题 ↗</button></article>`).join('')}</div>`)}<div>${panel('本轮风险与待办',alerts())}${panel('计算口径',`<ol class="method-list"><li>项目贡献：增长、韧性与客户体验三项评分，按当前权重加权求和。组合贡献为项目贡献之和，未建模收益协同或重叠。</li><li>组合风险：按项目预算加权平均的演练风险分，不是发生概率。</li><li>工期：前置项目完成后才能启动；假定无前置关系的项目可并行，不等同于资源均衡排程。</li><li>资料覆盖：已核对的关联资料数 / 关联资料总数，重复资料只计一次。</li><li>所有可行组合均满足固定必选、手动必选、排除、依赖以及资源约束。</li><li>韧性优先和增长优先仍使用相同硬约束，只调整搜索时的目标权重。</li></ol><p class="subtle">真实决策需要替换为组织认可的数据与模型，并完成验证。</p>`,'section-gap')}</div></div>`;}
  function execution(){const completed=plan?plan.items.filter(p=>state.tasks[p.id]==='done').length:0;return heading('05 / Human decision','系统准备充分，由人作出决定。','确认只在本地演练中生效；没有对外发送、付款、真实审批或自动执行业务。')+(!plan?panel('审批与执行',infeasible()):`<div class="two-col"><div>${panel(approved()?'本轮方案已确认':'确认本轮演练方案',approved()?`<span class="tag">演练确认已生效</span><p class="section-gap">${escape(state.approval.note)}</p><p class="subtle">确认时间：${escape(new Date(state.approval.at).toLocaleString('zh-CN'))}。任何条件或所选方案变化都会使本次确认失效。</p><div class="actions"><button class="secondary" data-action="brief">导出决策简报 ↓</button><button class="text-button" data-action="revoke">撤回本轮确认</button></div>`:`<p class="subtle">${selectedName()} · ${plan.items.length} 个项目 · ${fmt(plan.cost)} 万元 · ${plan.people} 人周</p><form id="approvalForm"><div class="checklist"><label><input type="checkbox" name="evidence">我已查看资料状态，并了解待更新与待补材料。</label><label><input type="checkbox" name="resources">我已审阅预算、人力、风险和前置依赖。</label></div><label class="form-label" for="approvalNote">本次选择的理由与需继续核实的事项</label><textarea class="approval-notes" name="note" id="approvalNote" maxlength="1000" placeholder="例如：先稳定交付与客户体验；供应商验证完成后再推进相应任务。" required minlength="5"></textarea><div class="form-error" id="approvalError" role="alert"></div><button class="primary" type="submit">确认本次演练方案 →</button></form>`)}<div class="section-gap">${panel('行动清单',`<div class="panel-head"><p class="subtle">${approved()?'按前置关系推进，未完成依赖的项目会保持锁定。':'本人确认方案后，才能操作执行状态。'}</p><span class="tag gray">${completed} / ${plan.items.length} 完成</span></div><div class="meter"><i style="width:${completed/plan.items.length*100}%"></i></div><ul class="execution-list">${plan.items.slice().sort((a,b)=>plan.schedule[a.id].start-plan.schedule[b.id].start).map((p,i)=>{const status=state.tasks[p.id]||'pending',blocked=p.deps.some(d=>state.tasks[d]!=='done');return `<li><span class="task-index ${status==='done'?'done':''}">${status==='done'?'✓':String(i+1).padStart(2,'0')}</span><div class="task-copy"><h3>${p.name}</h3><p>${p.owner} · ${status==='done'?'已完成':status==='active'?'进行中':blocked?'等待 '+p.deps.filter(d=>state.tasks[d]!=='done').map(d=>E.find(d).short).join('、'):'可启动'} · ${p.weeks+(state.config.shock&&state.config.scenario==='supply'&&p.id==='p2'?2:0)} 周</p></div><button class="${status==='active'?'primary':'secondary'}" data-task="${p.id}" ${!approved()||blocked||status==='done'?'disabled':''}>${status==='done'?'已完成':status==='active'?'标记完成':blocked?'等待前置':'开始演练'}</button></li>`;}).join('')}</ul>`)}</div></div><div>${panel('所选方案资源',`<div class="plan-stat"><span>预算 / 上限</span><b>${fmt(plan.cost)} / ${model.env.budget} 万元</b></div><div class="plan-stat"><span>总投入 / 上限</span><b>${plan.people} / ${model.env.capacity} 人周</b></div><div class="plan-stat"><span>风险 / 上限</span><b>${plan.risk} / ${model.env.risk}</b></div><div class="plan-stat"><span>工期 / 上限</span><b>${plan.weeks} / ${model.env.horizon} 周</b></div><div class="actions"><button class="text-button" data-action="brief">导出决策简报 ↗</button></div>`)}<div class="section-gap">${panel('前置关系与最早排期',timeline())}</div></div></div>`);}
  function history(){return heading('06 / Decision journal','让每次调整，都有迹可循。','记录保存在当前浏览器。可导出迁移；这份演练日志不具有不可篡改审计或身份认证能力。')+`<div class="equal-col">${panel('带走这次演练',`<p class="subtle">JSON 文件包含条件、选择、确认备注、执行状态与操作记录；可导回工作台继续研究。导入后需要重新确认方案。</p><div class="actions"><button class="primary" data-action="export">导出 JSON ↓</button><button class="secondary" data-action="import">导入记录 ↑</button></div>`)}${panel('一份能讨论的决策材料',`<p class="subtle">导出独立 HTML 简报，包含所选项目、资源约束、资料缺口、决策说明与行动状态。可以浏览、打印或与团队讨论。</p><div class="actions"><button class="secondary" data-action="brief" ${!plan?'disabled':''}>导出决策简报 ↓</button></div>`)}</div>${panel('操作记录',state.history.map(h=>`<article class="audit-row"><time>${escape(new Date(h.at).toLocaleString('zh-CN'))}</time><div><h3>${escape(h.title)}</h3><p>${escape(h.detail)}</p></div></article>`).join('')||'<div class="empty">尚无操作记录</div>')}`;}
  function render(){compute();$('#workspace').innerHTML=({overview,scenarios,portfolio,evidence:evidenceView,execution,history}[route])();document.querySelectorAll('#nav a').forEach(a=>{if(a.dataset.route===route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});document.title=labels[route]+' · ATLAS / ZAOZ';save();}
  function openDialog(html){$('#dialogContent').innerHTML=html;$('#detailDialog').showModal();}
  function closeDialog(){if($('#detailDialog').open)$('#detailDialog').close();}
  function projectDialog(id){const p=E.find(id);if(!p)return;openDialog(`<p class="eyebrow">PROJECT / ${p.id.toUpperCase()}</p><h2 id="dialogTitle">${p.name}</h2><p>${p.description}</p><div class="detail-stats"><div>基线预算<strong>${p.cost}<small> 万元</small></strong></div><div>团队投入<strong>${p.people}<small> 人周</small></strong></div><div>基线周期<strong>${p.weeks}<small> 周</small></strong></div></div><div class="plan-stat"><span>增长 / 韧性 / 客户体验</span><b>${p.growth} / ${p.resilience} / ${p.experience}</b></div><div class="plan-stat"><span>演练风险分</span><b>${p.risk}</b></div><div class="plan-stat"><span>前置项目</span><b>${p.deps.map(d=>E.find(d).name).join('、')||'无'}</b></div><p class="subtle section-gap">关联示例资料</p><div class="evidence-list">${p.evidence.map(id=>{const e=E.evidence.find(s=>s.id===id);return `<div class="evidence-card"><h3>${e.name} <span class="tag ${e.status==='ready'?'':'orange'}">${e.label}</span></h3><p>${e.note}</p></div>`;}).join('')}</div>`);}
  function evidenceDialog(id){const e=E.evidence.find(x=>x.id===id);if(!e)return;openDialog(`<p class="eyebrow">EVIDENCE / 示例资料</p><h2 id="dialogTitle">${e.name}</h2><span class="tag ${e.status==='ready'?'':'orange'}">${e.label}</span><p class="section-gap">${e.note}</p><h3>关联项目</h3><p>${E.projects.filter(p=>p.evidence.includes(id)).map(p=>p.name).join('、')}</p><h3>真实使用时应核对</h3><ol class="method-list"><li>资料的来源、收集时间和适用范围。</li><li>是否存在缺失、过期、偏差或互相矛盾的信息。</li><li>评分、成本、工期假设是否得到负责团队认可。</li><li>是否获得处理资料与执行行动的相应授权。</li></ol>`);}
  function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
  function exportJSON(){log('导出演练记录','导出当前条件、方案和本地操作记录。');save();download('ZAOZ-ATLAS-决策记录.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json;charset=utf-8');if(route==='history')render();toast('已生成可重新导入的 JSON 记录。');}
  function exportBrief(){if(!plan){toast('当前没有可导出的可行方案。');return;}const esc=escape,approvedNow=approved(),rows=plan.items.map(p=>`<tr><td>${p.name}</td><td>${fmt(p.cost*model.env.costFactor)} 万元</td><td>${p.people} 人周</td><td>${p.deps.map(d=>E.find(d).name).join('、')||'无'}</td><td>${state.tasks[p.id]==='done'?'已完成':state.tasks[p.id]==='active'?'进行中':'未启动'}</td></tr>`).join('');const doc=`<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZAOZ ATLAS 决策简报</title><style>body{max-width:900px;margin:50px auto;padding:0 25px;color:#24322e;background:#fffefa;font:14px/1.9 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}h1,h2{font-family:"Songti SC",serif}h1{font-size:32px}h2{margin-top:32px}small{color:#738078}table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:11px 8px;border-bottom:1px solid #dedfd7}blockquote{background:#f5e6dc;padding:18px;border-left:3px solid #b74e2f;margin:20px 0}p,td{overflow-wrap:anywhere}footer{border-top:1px solid #ddd;margin-top:35px;padding-top:18px;font-size:11px;color:#738078}@media print{body{margin:0;max-width:none}}</style><header><small>ZAOZ / ATLAS · 组织决策演练</small><h1>${E.scenarios[state.config.scenario].name}：本轮决策简报</h1><p>${esc(selectedName())} · 导出于 ${esc(new Date().toLocaleString('zh-CN'))}</p></header><blockquote>本材料仅为交互原型的虚构演练，不代表真实企业数据、业务审批或收益预测。</blockquote><h2>条件与选择</h2><p>预算 ${fmt(plan.cost)} / ${model.env.budget} 万元；总投入 ${plan.people} / ${model.env.capacity} 人周；依赖工期 ${plan.weeks} / ${model.env.horizon} 周；组合风险 ${plan.risk} / ${model.env.risk}。目标贡献 ${fmt(E.score(plan,state.config.weights))} 加权分。</p><p>目标权重：增长 ${state.config.weights.growth}，韧性 ${state.config.weights.resilience}，客户体验 ${state.config.weights.experience}。压力事件：${state.config.shock?E.scenarios[state.config.scenario].event:'未开启'}。</p><table><thead><tr><th>项目</th><th>投入</th><th>人力</th><th>前置项目</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table><h2>资料与不确定性</h2><ul>${plan.sources.map(e=>`<li>${e.name} — ${e.label}：${e.note}</li>`).join('')}</ul><h2>确认与理由</h2><p>${approvedNow?'本地演练方案已确认；无真实业务效力。':'尚未确认方案。'}</p><p>${approvedNow?esc(state.approval.note):'待本人核对资料、资源与风险。'}</p><h2>计算口径</h2><p>项目贡献按增长、韧性与体验评分加权求和；风险按预算加权；工期按前置依赖计算，不模拟周度资源均衡。项目贡献未建模协同与重叠，分数并非成功概率。全部样例假设需要在真实使用前替换并验证。</p><footer>ZAOZ — Build What Matters. 生成此材料不涉及外部模型调用。</footer></html>`;download('ZAOZ-ATLAS-决策简报.html',doc,'text/html;charset=utf-8');log('导出决策简报',selectedName()+'；'+plan.items.length+' 个项目；确认状态：'+(approvedNow?'已确认':'待确认'));save();if(route==='history')render();toast('独立 HTML 简报已生成，可打开或打印。');}
  const actions={
    guide(){openDialog(`<p class="eyebrow">A 3-MINUTE WALKTHROUGH</p><h2 id="dialogTitle">走完一次完整的决策。</h2><ol class="guide-list"><li><b>先看全局</b><p>了解情境、资源占用和系统识别的待办。</p></li><li><b>改变条件，比较取舍</b><p>调整预算或目标权重，加入压力事件，比较三种方案。</p></li><li><b>回到项目和依据</b><p>核查前置依赖、缺失资料；可设定必选与排除项目。</p></li><li><b>本人确认，再推进执行</b><p>写下理由，确认后按前置关系推进。条件变化会使旧确认失效。</p></li><li><b>导出能讨论的材料</b><p>带走 HTML 简报或 JSON 记录，支持离线查看与再次导入。</p></li></ol><div class="actions"><button class="primary" data-guide-route="scenarios">开始比较方案 →</button></div>`);},
    shock(){changeConfig({...state.config,shock:!state.config.shock},state.config.shock?'关闭压力事件':'加入压力事件',E.scenarios[state.config.scenario].event);},
    export:exportJSON,brief:exportBrief,
    import(){$('#importFile').value='';$('#importFile').click();},
    revoke(){if(!approved())return;state.approval=null;state.tasks={};log('撤回本轮演练确认','已清除执行状态，需要重新核对并确认。');save();render();toast('已撤回确认和执行状态。');},
    reset(){openDialog(`<p class="eyebrow">RESET WORKSPACE</p><h2 id="dialogTitle">重新开始这次演练？</h2><p>此浏览器内的条件、备注和执行记录将被替换为默认样例。你可以先导出记录，再重新开始。</p><div class="actions"><button class="secondary" data-action="export">先导出记录 ↓</button><button class="primary accent" data-action="confirm-reset">重置为默认演练</button></div>`);},
    'confirm-reset'(){state=makeState();log('重新开始演练','恢复默认新品上市场景；已清除旧的本地记录。');compute();closeDialog();save();navigate('overview');toast('已恢复默认演练。');},
    'close-dialog':closeDialog
  };
  document.addEventListener('click',event=>{
    const target=event.target.closest('[data-action],[data-route],[data-project],[data-evidence],[data-plan],[data-task],[data-guide-route]');if(!target||target.disabled)return;
    if(target.dataset.action){event.preventDefault();actions[target.dataset.action]?.();return;}
    if(target.dataset.guideRoute){closeDialog();navigate(target.dataset.guideRoute);return;}
    if(target.dataset.route){event.preventDefault();navigate(target.dataset.route);return;}
    if(target.dataset.project){projectDialog(target.dataset.project);return;}
    if(target.dataset.evidence){evidenceDialog(target.dataset.evidence);return;}
    if(target.dataset.plan){if(state.selected===target.dataset.plan)return;const option=model.options.find(o=>o.id===target.dataset.plan);if(!option?.plan)return;state.approval=null;state.tasks={};state.selected=option.id;compute();log('切换所选方案',option.name+'；审批与执行状态已重新开始。');save();render();toast('已选择'+option.name+'。');return;}
    if(target.dataset.task){if(!approved())return;const p=E.find(target.dataset.task);if(!plan.ids.includes(p.id)||p.deps.some(d=>state.tasks[d]!=='done'))return;const previous=state.tasks[p.id];if(previous==='done')return;state.tasks[p.id]=previous==='active'?'done':'active';log(previous==='active'?'项目标记完成':'启动项目演练',p.name+'；'+p.owner);save();render();toast(p.name+(previous==='active'?'已标记完成。':'进入执行演练。'));}
  });
  document.addEventListener('input',event=>{const el=event.target;if(el.type==='range'){const out=document.querySelector(`output[for="${el.id}"]`);if(out)out.textContent=el.value+(el.dataset.unit||'');}if(el.id==='projectSearch'){let visible=0;document.querySelectorAll('[data-search]').forEach(row=>{row.hidden=!row.dataset.search.toLowerCase().includes(el.value.trim().toLowerCase());if(!row.hidden)visible++;});$('#searchEmpty').hidden=visible>0;}});
  document.addEventListener('change',event=>{
    const el=event.target;if(el.id==='scenarioSelect'){const next=E.defaults(el.value);changeConfig(next,'切换演练情境',E.scenarios[next.scenario].name+'；已使用该情境的默认资源与目标。');}
    if(el.dataset.constraint){const id=el.dataset.constraint,next={...state.config,locked:state.config.locked.filter(x=>x!==id),excluded:state.config.excluded.filter(x=>x!==id)};if(el.value==='locked')next.locked.push(id);if(el.value==='excluded')next.excluded.push(id);changeConfig(next,'修改项目约束',E.find(id).name+'：'+({optional:'自动比较',locked:'必须纳入',excluded:'本轮排除'}[el.value]));}
  });
  document.addEventListener('submit',event=>{
    if(event.target.id==='configForm'){event.preventDefault();const data=new FormData(event.target),next={...state.config,weights:{}};['budget','capacity','horizon','risk'].forEach(k=>next[k]=Number(data.get(k)));['growth','resilience','experience'].forEach(k=>next.weights[k]=Number(data.get(k)));changeConfig(next,'重新推演条件',`预算 ${next.budget} 万元，人力 ${next.capacity} 人周，期限 ${next.horizon} 周，风险上限 ${next.risk}。`);}
    if(event.target.id==='approvalForm'){event.preventDefault();const data=new FormData(event.target),note=String(data.get('note')||'').trim();if(!data.get('evidence')||!data.get('resources')||note.length<5){$('#approvalError').textContent='请完成两项核对，并写下至少 5 个字的决定理由。';return;}if(!plan?.feasible)return;state.approval={at:new Date().toISOString(),note:note.slice(0,1000),signature:signature()};state.tasks={};log('本人确认演练方案',selectedName()+'；'+note);save();render();toast('方案已确认，可以按前置关系推进演练。');}
  });
  $('#importFile').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>1024*1024)throw new Error('记录文件不能超过 1 MB');const imported=JSON.parse(await file.text());if(imported.version!==VERSION)throw new Error('不支持此版本的记录');const config=E.validateConfig(imported.config),selected=E.policies.some(p=>p.id===imported.selected)?imported.selected:'recommended';state={...makeState(),config,selected,history:cleanHistory(imported.history)};compute();log('导入演练记录','条件与历史已导入；为重新核对资料，旧确认与执行状态不予恢复。');save();render();toast('导入成功，请重新审阅并确认方案。');}catch(e){toast('未导入：'+e.message);}});
  window.addEventListener('hashchange',()=>{route=routes.includes(location.hash.slice(1))?location.hash.slice(1):'overview';render();$('#workspace').focus({preventScroll:true});});
  render();
})();

</script>
</body>
