document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)navigate(b.dataset.view);if(b.dataset.switch)navigate(b.dataset.switch);if(b.hasAttribute('data-close'))$('modal').close();if(b.hasAttribute('data-new-task'))taskForm();if(b.hasAttribute('data-example'))offerImport(copy(EXAMPLE));if(b.dataset.editTask)taskForm(b.dataset.editTask);if(b.dataset.editSchedule)scheduleForm(b.dataset.editSchedule);if(b.dataset.editRecord)recordForm(b.dataset.editRecord);if(b.dataset.editDecision)decisionForm(b.dataset.editDecision);if(b.dataset.confirmDecision)confirmDecision(b.dataset.confirmDecision,b.dataset.option);if(b.dataset.reopenDecision){const d=data.decisions.find(x=>x.id===b.dataset.reopenDecision);if(d)change(()=>{d.status='open';d.selectedId=null;d.confirmedAt=null;d.reason='';});}});
const tabs=[...document.querySelectorAll('[data-view]')];tabs.forEach((b,i)=>b.onkeydown=e=>{let next;if(e.key==='ArrowRight')next=(i+1)%tabs.length;if(e.key==='ArrowLeft')next=(i+tabs.length-1)%tabs.length;if(e.key==='Home')next=0;if(e.key==='End')next=tabs.length-1;if(next!==undefined){e.preventDefault();navigate(tabs[next].dataset.view,true);}});
render();if(data.meta.updatedAt&&storageWorks)$('saveStatus').textContent='已恢复浏览器记录 · '+data.meta.updatedAt.slice(0,10);
})();
</script></body></html>
